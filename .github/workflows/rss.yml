name: Generate RSS Feed

on:
  schedule:
    # 中国時間 11:30 = UTC 3:30
    - cron: '30 3 */2 * *'
  workflow_dispatch:

# 権限を明示的に設定（重要！）
permissions:
  contents: write  # リポジトリへの書き込み権限

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 feedgen
        
    - name: Run RSS generator
      run: |
        python rss_generator.py
        
    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add feed.xml cache.json
        git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
        git push
